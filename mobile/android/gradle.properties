# Giới hạn RAM tối ưu cho Gradle (thay vì 8GB + 4GB mặc định gây ngốn RAM)
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Tự động tắt tiến trình ngầm Gradle sau 60 giây không sử dụng để giải phóng 100% RAM
org.gradle.daemon.idletimeout=60000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
